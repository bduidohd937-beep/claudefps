name: FPS verification
on:
  push:
    branches: ['main', 'feat/**', 'fix/**']
  pull_request:
    branches: ['main', 'feat/**', 'fix/**']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
